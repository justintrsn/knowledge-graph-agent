services:
  neo4j:
    image: neo4j:5.26.32-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-localdevpassword}
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p '${NEO4J_PASSWORD:-localdevpassword}' 'RETURN 1'"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s

  app:
    build: .
    depends_on:
      neo4j:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-localdevpassword}
    volumes:
      - ./outputs:/app/outputs
      - ./cache:/app/cache
      - ./config.yaml:/app/config.yaml
