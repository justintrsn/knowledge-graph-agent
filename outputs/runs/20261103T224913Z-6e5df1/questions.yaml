- id: Q5
  question: Which vessels due at Rotterdam next week are most likely to miss their berth window, and why?
  story: US3
  expected_answer: 'Next week is Mon 2 Nov to Sun 8 Nov 2026. Six arrivals: Northern Lark, Arctic Fern,
    Kestrel Bay, Amber Coast, Celtic Dawn and Rio Verde. Confirmed: Arctic Fern''s revised ETA (4 Nov
    15:00 local) is already after its window closes (3 Nov 16:00 local), with confirmed hull fouling.
    Unverified: the engine faults on Kestrel Bay (no speed loss reported) and Celtic Dawn. Rotterdam''s
    rising average wait (about 36-40 h) is port-wide context, never a fact about one vessel. Rio Verde
    sails from Santos, whose congestion feed has no data after 4 Oct, so conditions there are unknown,
    not normal. The ranking is an inference with its basis stated, and the answer says the extra messages
    were not processed.

    '
  rubric:
  - id: Q5.window
    failure_type: temporal_error
    check:
      kind: section_matches
      section: interpretation
      patterns:
      - 2 Nov|2026-11-02
      - 8 Nov|2026-11-08
  - id: Q5.all_six
    failure_type: incomplete_coverage
    check:
      kind: section_matches
      section: any
      patterns:
      - Northern Lark
      - Arctic Fern
      - Kestrel Bay
      - Amber Coast
      - Celtic Dawn
      - Rio Verde
  - id: Q5.arctic_fern_confirmed
    failure_type: label_confusion
    check:
      kind: cites
      section: confirmed_facts
      evidence_id: VG-1088
  - id: Q5.kestrel_bay_unverified
    failure_type: label_confusion
    check:
      kind: cites
      section: unverified_reports
      evidence_id: INC-224
  - id: Q5.celtic_dawn_unverified
    failure_type: label_confusion
    check:
      kind: cites
      section: unverified_reports
      evidence_id: INC-219
  - id: Q5.faults_not_confirmed
    failure_type: label_confusion
    check:
      kind: section_absent
      section: confirmed_facts
      pattern: INC-224|INC-219
  - id: Q5.congestion_port_wide
    failure_type: label_confusion
    check:
      kind: judge
      instruction: 'Rotterdam''s congestion and average waits are given as port-wide context, never as
        a fact about any one vessel.

        '
  - id: Q5.santos_unknown
    failure_type: missing_data_masked
    check:
      kind: judge
      instruction: 'Conditions at Santos, Rio Verde''s origin, are reported as unknown because the feed
        has no data after 4 Oct, not as normal and not left out.

